<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -47.5 255 255" fill="none">
  <!-- Letter D -->
  <text x="2" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="900" fill="#0284C7">D</text>
  
  <!-- Central Atom Emblem (Representing O) -->
  <g transform="translate(112, 80)">
    <!-- Vertical Orbit -->
    <ellipse cx="0" cy="0" rx="25" ry="70" stroke="#0284C7" stroke-width="3.5" fill="none"/>
    <!-- Diagonal Orbit 1 -->
    <ellipse cx="0" cy="0" rx="25" ry="70" stroke="#0284C7" stroke-width="3.5" fill="none" transform="rotate(60)"/>
    <!-- Diagonal Orbit 2 -->
    <ellipse cx="0" cy="0" rx="25" ry="70" stroke="#0284C7" stroke-width="3.5" fill="none" transform="rotate(-60)"/>
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="16" fill="#0284C7"/>
  </g>
  
  <!-- Letter P -->
  <text x="145" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="900" fill="#0284C7">P</text>
</svg>
