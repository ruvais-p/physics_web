services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: physics_dept_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-physics_db}
    ports:
      # Expose only on localhost for host access / admin tools if needed
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-physics_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Dedicated Database Migration Service (Runs committed migrations and exits)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: physics_dept_migration
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-physics_db}?schema=public"
      PRISMA_CLIENT_ENGINE_TYPE: "binary"

  # ----------------------------------------------------------------------------
  # Next.js Web Application Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: physics_dept_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-physics_db}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Error JWT_SECRET must be set in .env}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:?Error SETTINGS_ENCRYPTION_KEY must be set in .env}"
      PRISMA_CLIENT_ENGINE_TYPE: "binary"
    volumes:
      # Mount named volume for all runtime uploads (faculty CVs, event flyers, curriculum PDFs)
      # Existing static images in public/ remain intact from the container image
      - uploads_data:/app/public/uploads

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: physics_dept_postgres_data
  uploads_data:
    name: physics_dept_uploads_data
